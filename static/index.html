<script>try{var d=document.documentElement,t=localStorage.getItem('tm-theme');if(t==='light'||t==='dark')d.dataset.theme=t;var w=JSON.parse(localStorage.getItem('tm.ui.sidebar.w'));if(w>=180&&w<=420)d.style.setProperty('--sidebar-w',w+'px');var c=JSON.parse(localStorage.getItem('tm.ui.sidebar.collapsed'));if(c===true||(c===null&&innerWidth>760&&innerWidth<1000))d.classList.add('side-collapsed');var v=new URLSearchParams(location.search).get('vault')||localStorage.getItem('tm.lastVault');if(!v||JSON.parse(localStorage.getItem('tm.v.'+v+'.sidebar.mode'))!=='project')d.classList.add('side-mode-explorer')}catch(e){}</script>
